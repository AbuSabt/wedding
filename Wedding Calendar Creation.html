<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>حفل زفاف وليد ابوسبت</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: white;
    }
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .emoji { font-size: 52px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .date {
      font-size: 15px;
      color: #c9b99a;
      margin-bottom: 6px;
    }
    .time {
      font-size: 14px;
      color: #a0aec0;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #c9a96e, #a07848);
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(201,169,110,0.4);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(201,169,110,0.5); }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #718096;
    }
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a96e, transparent);
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">💍</div>
    <h1>حفل زفاف وليد ابوسبت</h1>
    <div class="divider"></div>
    <div class="date">الجمعة، 1 مايو 2026</div>
    <div class="time">9:00 م – 10:30 م</div>
    <a class="btn" href="https://raw.githubusercontent.com/AbuSabt/wedding/refs/heads/main/Wedding%20Calendar%20Invite.ics" download="حفل_زفاف_وليد.ics">
      📅 أضف لتقويمك
    </a>
    <div class="note">سيُضاف الحفل تلقائياً لتقويمك</div>
  </div>

  <script>
    // Auto-trigger download on page load
    window.addEventListener('load', function() {
      setTimeout(function() {
        const link = document.createElement('a');
        link.href = "https://raw.githubusercontent.com/AbuSabt/wedding/refs/heads/main/Wedding%20Calendar%20Invite.ics";
        link.download = "حفل_زفاف_وليد.ics";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }, 800);
    });
  </script>
</body>
</html>
